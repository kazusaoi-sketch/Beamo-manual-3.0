name: Build content-data.js

on:
  push:
    branches: [main]
    paths:
      - "content/articles/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # update_readme_changelog.py diffs content/articles between the
          # before/after commits of this push, so we need full history here
          # (not just the latest commit).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild content-data.js
        run: python3 scripts/build_content.py

      - name: Update README changelog
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: python3 scripts/update_readme_changelog.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- content-data.js README.md; then
            echo "nothing to commit"
          else
            git add content-data.js README.md
            git commit -m "chore: rebuild content-data.js and update README changelog"
            git push
          fi
