name: Translate & Register New Manual Doc

# 컨플루언스에 새로 쓴 문서를 번역해서 이 사이트(content/articles/*.json)에 등록하고,
# 컨플루언스 한국어/일본어 페이지에도 게시한 뒤 이 저장소에 PR을 엽니다.
# 로컬(Mac) Automator 버튼과 같은 파이썬 스크립트(publish_to_site.py)를 공유합니다 —
# 자세한 내용은 saranmoon-ai/Beamo---Sync- 저장소의 HANDOVER.md 참고.

on:
  workflow_dispatch:
    inputs:
      confluence_url:
        description: "번역할 Confluence 페이지 URL"
        required: true
        type: string
      feature:
        description: "카테고리 — 신규 문서일 때만 필요 (기존 문서면 비워두기)"
        required: false
        type: choice
        options:
          - ""
          - getting-started
          - survey
          - 3d-workspace
          - admin
          - appendix
          - whats-new
      version:
        description: "버전 — 신규 문서일 때만 필요 (기존 문서면 비워두기)"
        required: false
        type: choice
        options:
          - ""
          - "3.0"
          - "2.0"
      platform_web:
        description: "플랫폼: web — 신규 문서일 때만 필요"
        required: false
        type: boolean
        default: false
      platform_aos:
        description: "플랫폼: aos — 신규 문서일 때만 필요"
        required: false
        type: boolean
        default: false
      platform_ios:
        description: "플랫폼: ios — 신규 문서일 때만 필요"
        required: false
        type: boolean
        default: false
      user_all:
        description: "대상 사용자: all — 신규 문서일 때만 필요"
        required: false
        type: boolean
        default: false
      user_surveyor:
        description: "대상 사용자: surveyor — 신규 문서일 때만 필요"
        required: false
        type: boolean
        default: false
      user_team_admin:
        description: "대상 사용자: team-admin — 신규 문서일 때만 필요"
        required: false
        type: boolean
        default: false
      user_collaborator:
        description: "대상 사용자: collaborator — 신규 문서일 때만 필요"
        required: false
        type: boolean
        default: false
      user_site_manager:
        description: "대상 사용자: site-manager — 신규 문서일 때만 필요"
        required: false
        type: boolean
        default: false
      user_super_admin:
        description: "대상 사용자: super-admin — 신규 문서일 때만 필요"
        required: false
        type: boolean
        default: false
      step:
        description: "스텝(챕터) 번호 — 신규 문서일 때만 필요"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4
        with:
          path: site

      - name: Checkout translation tools repo
        uses: actions/checkout@v4
        with:
          repository: saranmoon-ai/Beamo---Sync-
          path: sync-tools
          token: ${{ secrets.SYNC_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests anthropic markdownify

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Run translation pipeline
        env:
          CONF_EMAIL: ${{ secrets.CONF_EMAIL }}
          CONF_TOKEN: ${{ secrets.CONF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_DIR: ${{ github.workspace }}/site
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sync-tools

          PLATFORMS=()
          [ "${{ github.event.inputs.platform_web }}" = "true" ] && PLATFORMS+=("web")
          [ "${{ github.event.inputs.platform_aos }}" = "true" ] && PLATFORMS+=("aos")
          [ "${{ github.event.inputs.platform_ios }}" = "true" ] && PLATFORMS+=("ios")
          PLATFORM_STR=$(IFS=,; echo "${PLATFORMS[*]}")

          USERS=()
          [ "${{ github.event.inputs.user_all }}" = "true" ] && USERS+=("all")
          [ "${{ github.event.inputs.user_surveyor }}" = "true" ] && USERS+=("surveyor")
          [ "${{ github.event.inputs.user_team_admin }}" = "true" ] && USERS+=("team-admin")
          [ "${{ github.event.inputs.user_collaborator }}" = "true" ] && USERS+=("collaborator")
          [ "${{ github.event.inputs.user_site_manager }}" = "true" ] && USERS+=("site-manager")
          [ "${{ github.event.inputs.user_super_admin }}" = "true" ] && USERS+=("super-admin")
          USER_STR=$(IFS=,; echo "${USERS[*]}")

          ARGS=("${{ github.event.inputs.confluence_url }}")
          [ -n "${{ github.event.inputs.feature }}" ] && ARGS+=(--feature "${{ github.event.inputs.feature }}")
          [ -n "${{ github.event.inputs.version }}" ] && ARGS+=(--version "${{ github.event.inputs.version }}")
          [ -n "$PLATFORM_STR" ] && ARGS+=(--platform "$PLATFORM_STR")
          [ -n "$USER_STR" ] && ARGS+=(--user "$USER_STR")
          [ -n "${{ github.event.inputs.step }}" ] && ARGS+=(--step "${{ github.event.inputs.step }}")
          python3 publish_to_site.py "${ARGS[@]}"
