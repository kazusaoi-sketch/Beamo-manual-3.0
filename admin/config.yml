backend:
  name: github
  repo: kazusaoi-sketch/Beamo-manual-3.0
  branch: main
  base_url: https://beamo-manual-oauth.kazusa-oi.workers.dev
  auth_endpoint: auth

# 문서별 이미지 폴더 패턴과 안 맞는 항목(로고 등 사이트 공통 자산)을 위한 기본값
media_folder: images
public_folder: images

collections:
  - name: articles
    label: 문서
    label_singular: 문서
    description: 이미 있는 매뉴얼 문서를 수정합니다. 새 문서는 컨플루언스 발행 파이프라인으로 추가하세요.
    folder: content/articles
    create: false
    format: json
    extension: json
    # 파일명 = key 필드 값 (예: s1-1.json). 저장 후 key를 바꾸면 새 파일이 생기니 주의.
    slug: "{{key}}"
    # 문서별 폴더로 나누지 않고, 위 전역 media_folder(images/)를 그대로 씀 -
    # Media 탭에서 올린 파일과 문서 안에서 삽입하는 파일이 같은 폴더/라이브러리를 보게 하기 위함
    fields:
      - label: "Key (문서 ID)"
        name: key
        widget: string
        hint: "저장 후에는 절대 바꾸지 마세요 — 파일명·이미지 폴더·컨플루언스 매핑과 전부 연결되어 있어요."

      - label: 버전
        name: version
        widget: select
        options: ["3.0", "2.0"]

      - label: 플랫폼
        name: platform
        widget: select
        multiple: true
        options: ["web", "aos", "ios"]

      - label: 기능 카테고리
        name: feature
        widget: select
        options:
          - { label: "시작하기", value: "getting-started" }
          - { label: "서베이", value: "survey" }
          - { label: "3D 워크스페이스", value: "3d-workspace" }
          - { label: "관리자", value: "admin" }
          - { label: "새 소식", value: "whats-new" }
          - { label: "부록", value: "appendix" }

      - label: 대상 사용자
        name: user
        widget: select
        multiple: true
        options: ["all", "surveyor", "team-admin", "collaborator", "site-manager", "super-admin"]

      - label: 스텝
        name: step
        widget: number
        value_type: int
        required: false

      - label: 정렬 순서
        name: order
        widget: number
        value_type: int
        hint: "같은 스텝 안에서 문서가 나열되는 순서예요. 숫자가 작을수록 먼저 나와요."

      - label: 다국어 콘텐츠
        name: i18n
        widget: object
        hint: "⚠️ 한 언어만 수정해도 다른 언어 버전은 자동으로 바뀌지 않아요. 내용이 달라지면 안 되는 수정이라면, 아래 다른 언어 탭에도 똑같이 반영해주세요."
        fields:
          - label: 한국어
            name: ko
            widget: object
            required: false
            fields:
              - { label: 제목, name: title, widget: string }
              - label: "본문"
                name: html
                widget: html-wysiwyg
                hint: "화면에 보이는 그대로 클릭해서 바로 고칠 수 있어요."

          - label: English
            name: en
            widget: object
            required: false
            fields:
              - { label: Title, name: title, widget: string }
              - label: "Body"
                name: html
                widget: html-wysiwyg
                hint: "Click directly on the text below to edit it."

          - label: 日本語
            name: ja
            widget: object
            required: false
            fields:
              - { label: タイトル, name: title, widget: string }
              - label: "本文"
                name: html
                widget: html-wysiwyg
                hint: "下のテキストを直接クリックして編集できます。"

  - name: pages
    label: 페이지
    label_singular: 페이지
    description: "매뉴얼 사이트의 독립 페이지(예: 플랜 및 요금제)를 수정합니다."
    files:
      - name: plans
        label: 플랜 및 요금제 페이지
        file: content/pages/plans.json
        description: "플랜 카드(Tier)는 자유롭게 추가·삭제·순서 변경할 수 있어요. '뱃지 문구'를 입력하면 그 카드가 강조 카드로 표시돼요."
        fields:
          - label: 다국어 콘텐츠
            name: i18n
            widget: object
            hint: "⚠️ 한 언어만 수정해도 다른 언어 버전은 자동으로 바뀌지 않아요. 내용이 달라지면 안 되는 수정이라면, 아래 다른 언어 탭에도 똑같이 반영해주세요."
            fields:
              - label: 한국어
                name: ko
                widget: object
                fields: &plans_page_fields
                  - { label: "뒤로가기 버튼 문구", name: backBtn, widget: string }
                  - { label: "히어로 라벨 (작은 상단 텍스트)", name: heroLabel, widget: string }
                  - { label: "히어로 타이틀", name: heroTitle, widget: string }
                  - { label: "히어로 서브타이틀", name: heroSubtitle, widget: text }
                  - label: "안내 문구 (placeholder 고지 등)"
                    name: notice
                    widget: text
                    hint: "페이지 상단에 ※ 기호와 함께 표시돼요."
                  - { label: "카드 하단 CTA 버튼 문구", name: ctaBtn, widget: string }
                  - label: "요금제 카드 (Tier)"
                    name: tiers
                    widget: list
                    label_singular: "요금제 카드"
                    hint: "카드를 추가·삭제하거나 드래그로 순서를 바꿀 수 있어요."
                    fields:
                      - { label: "카드 이름 (예: Tier 1 · Standard)", name: name, widget: string }
                      - label: "뱃지 문구 (예: 가장 많이 선택)"
                        name: tag
                        widget: string
                        required: false
                        hint: "비워두면 뱃지가 표시되지 않아요. 채우면 이 카드가 강조 카드로 표시돼요."
                      - { label: "가격 문구", name: price, widget: string }
                      - { label: "가격 보조 설명", name: priceNote, widget: string }
                      - label: "기능 목록"
                        name: features
                        widget: list
                        hint: "항목을 하나씩 추가하세요."

              - label: English
                name: en
                widget: object
                fields: *plans_page_fields

              - label: 日本語
                name: ja
                widget: object
                fields: *plans_page_fields
